<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Assistant</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div id="episode-info" style="display: none;">
        <span id="anime-name"></span>
        <span id="episode-label"></span>
      </div>
      <button id="settings-btn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

    <div id="settings-panel">
      <div class="settings-row">
        <label for="provider-select">Provider</label>
        <select id="provider-select"></select>
      </div>

      <div id="custom-provider-form" style="display: none;">
        <div class="settings-row">
          <label for="custom-name">Custom provider name</label>
          <input type="text" id="custom-name" placeholder="e.g. My OpenAI proxy">
        </div>
        <div class="settings-row">
          <label for="custom-base-url">Base URL</label>
          <input type="text" id="custom-base-url" placeholder="https://api.example.com/v1">
        </div>
        <div class="settings-row">
          <label for="custom-adapter">API format</label>
          <select id="custom-adapter">
            <option value="openai">OpenAI</option>
            <option value="openaiCompatible">OpenAI-compatible (OpenRouter, etc.)</option>
            <option value="anthropic">Anthropic</option>
            <option value="gemini">Google Gemini</option>
          </select>
        </div>
        <div class="settings-row">
          <label for="custom-api-key">API key</label>
          <input type="password" id="custom-api-key" placeholder="Paste API key here">
        </div>
        <div class="settings-row">
          <label for="custom-model">Model</label>
          <div class="model-input-wrap">
            <input type="text" id="custom-model" list="custom-model-list" placeholder="Type or select a model">
            <button id="fetch-custom-models-btn" type="button" title="Fetch available models">↻</button>
          </div>
          <datalist id="custom-model-list"></datalist>
        </div>
        <div class="settings-row settings-row-inline custom-actions">
          <button id="save-custom-provider-btn" class="secondary-btn">Add provider</button>
          <button id="cancel-custom-provider-btn" class="secondary-btn">Cancel</button>
        </div>
      </div>

      <div id="provider-settings">
        <div class="settings-row">
          <label for="api-key-input" id="api-key-label">API Key</label>
          <input type="password" id="api-key-input" placeholder="Paste your API key here">
        </div>
        <button id="save-key-btn" class="settings-btn">Save key</button>
        <div class="settings-row model-row">
          <label for="model-input">Model</label>
          <div class="model-input-wrap">
            <input type="text" id="model-input" list="model-list" placeholder="Type or select a model">
            <button id="fetch-models-btn" type="button" title="Fetch available models">↻</button>
          </div>
          <datalist id="model-list"></datalist>
        </div>
        <div class="settings-row" id="delete-provider-row" style="display: none;">
          <button id="delete-provider-btn" class="settings-btn danger-text">Remove provider</button>
        </div>
      </div>

      <div class="settings-row settings-row-inline">
        <label for="spoiler-toggle">Spoiler-free mode</label>
        <input type="checkbox" id="spoiler-toggle">
      </div>
      <div id="manual-override-row" class="settings-row" style="display: none;">
        <label for="manual-input">What are you watching?</label>
        <div class="settings-row-inline" style="gap: 6px; display: flex;">
          <input type="text" id="manual-input" placeholder="e.g. Log Horizon S1E4">
          <button id="clear-manual-btn">Reset</button>
        </div>
      </div>
    </div>

    <div id="messages"></div>

    <div id="clear-chat-bar">
      <button id="clear-chat-btn">Clear chat</button>
    </div>

    <div id="input-bar">
      <input type="text" id="user-input" placeholder="Ask about this episode...">
      <button id="send-btn">Send</button>
    </div>

    <div id="status-msg"></div>
  </div>

  <script src="../lib/browser-polyfill.js"></script>
  <script src="providers.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
